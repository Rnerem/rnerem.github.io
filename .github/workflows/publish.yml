name: Build and deploy Quarto site
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.18'
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Set deployment URL
        if: github.event_name != 'pull_request'
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          Path('_quarto-deploy.yml').write_text('website:\n  site-url: ' + json.dumps(os.environ['SITE_URL']) + '\n')
          PYTHON
      - name: Render pull request preview
        if: github.event_name == 'pull_request'
        run: quarto render
      - name: Render site for deployment
        if: github.event_name != 'pull_request'
        run: quarto render --profile deploy
      - name: Check internal links
        run: python3 scripts/check_site.py
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
